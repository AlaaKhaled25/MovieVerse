<!DOCTYPE html>
<html>
<head>
  
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MovieVerse - Flutter movie app (TMDB, Firebase, Provider, SQFLite)">

  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MovieVerse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MovieVerse</title>
  <link rel="manifest" href="manifest.json">

  <style>
    
    html, body { margin: 0; height: 100%; }
    #boot-splash {
      position: fixed; inset: 0;
      background: linear-gradient(180deg, #0B1424 0%, #1E3A5F 100%);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      text-align: center;
      z-index: 9999;
    }
    #boot-splash .logo {
      width: 116px; height: 116px;
      background: linear-gradient(135deg, #22344F, #16263C);
      border: 2px solid rgba(245, 197, 24, 0.7);
      border-radius: 30px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 34px rgba(245, 197, 24, 0.25);
    }
    #boot-splash .logo svg { fill: #F5C518; }  
    #boot-splash h1 {
      color: #F5F5F5; font-family: Arial, sans-serif;
      margin: 28px 0 0; font-size: 38px; font-weight: bold; letter-spacing: 1.4px;
    }
    #boot-splash p  {
      color: #B0BEC5; font-family: Arial, sans-serif;
      margin: 10px 0 0; font-size: 14px; letter-spacing: 0.5px;
    }
    #boot-splash .bar {
      width: 56px; height: 3px; margin-top: 18px;
      background: #F5C518; border-radius: 2px;
    }
    #boot-splash .spinner {
      width: 24px; height: 24px; margin-top: 28px;
      border: 2.5px solid rgba(245, 197, 24, 0.25);
      border-top-color: #F5C518;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  
  <div id="boot-splash">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="66" height="66" aria-hidden="true">
        
        <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
      </svg>
    </div>
    <h1>MovieVerse</h1>
    <p>Your personal cinema companion</p>
    <div class="bar"></div>
    <div class="spinner"></div>
  </div>

  
  <script src="flutter_bootstrap.js" async></script>
  <script>
    
    window.addEventListener("flutter-first-frame", function () {
      var el = document.getElementById("boot-splash");
      if (el) { el.style.transition = "opacity 0.3s"; el.style.opacity = "0"; setTimeout(function(){ el.remove(); }, 350); }
    });
  </script>
</body>
</html>
