<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MovieVerse - Flutter movie app (TMDB, Firebase, Provider, SQFLite)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MovieVerse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MovieVerse</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Branded pre-Flutter loader: navy background matching lib/utils/app_colors.dart. */
    html, body { margin: 0; height: 100%; }
    #boot-splash {
      position: fixed; inset: 0;
      background: #0F1B2B;                 /* AppColors.primary */
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }
    #boot-splash .logo {
      width: 108px; height: 108px;
      background: #1B2A3F;                 /* AppColors.surface */
      border: 2px solid rgba(245, 197, 24, 0.6);
      border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }
    #boot-splash .logo svg { fill: #F5C518; }  /* AppColors.accent */
    #boot-splash h1 { color: #F5F5F5; font-family: Arial, sans-serif; }
    #boot-splash p  { color: #B0BEC5; font-family: Arial, sans-serif; }
    #boot-splash .spinner {
      width: 24px; height: 24px; margin-top: 28px;
      border: 2.5px solid rgba(245, 197, 24, 0.25);
      border-top-color: #F5C518;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Hidden once the Flutter engine draws its first frame. -->
  <div id="boot-splash">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true">
        <!-- movie_filter icon -->
        <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
      </svg>
    </div>
    <h1 style="margin:24px 0 0;font-size:34px;font-weight:bold;letter-spacing:1px;">MovieVerse</h1>
    <p style="margin:8px 0 0;font-size:14px;">Your personal cinema companion</p>
    <div class="spinner"></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // A "click" that hides the boot splash once Flutter is ready.
    window.addEventListener("flutter-first-frame", function () {
      var el = document.getElementById("boot-splash");
      if (el) { el.style.transition = "opacity 0.3s"; el.style.opacity = "0"; setTimeout(function(){ el.remove(); }, 350); }
    });
  </script>
</body>
</html>
