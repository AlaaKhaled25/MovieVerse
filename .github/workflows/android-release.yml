name: Build & Release Android APK

on:


  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Generate TMDB API config
        run: |
          mkdir -p lib/config
          cat > lib/config/api_config.dart <<'EOF'
          class ApiConfig {
            ApiConfig._();
            static const String tmdbApiKey = '${{ secrets.TMDB_API_KEY }}';
          }
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Create/update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MovieVerse ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
